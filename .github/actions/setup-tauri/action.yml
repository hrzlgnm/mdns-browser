name: Setup tauri
description: Installs cargo-auditable for auditable release builds (invoked through the scripts/cargo wrapper on PATH)

runs:
  using: "composite"
  steps:
    - uses: baptiste0928/cargo-install@8195d4f734a149db85385bb4102b42efcd373759 # v3
      with:
        crate: cargo-auditable
        version: 0.7.6
        locked: true

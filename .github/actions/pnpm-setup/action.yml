name: "Setup pnpm"
description: "Install pnpm on Node 24 and optionally restore the pnpm store via actions/cache (when inputs.cache is true) using a per-job/per-run key so parallel jobs don't collide on the same cache save."
inputs:
  cache:
    description: "Whether to restore/save pnpm store via actions/cache"
    required: false
    default: "true"
runs:
  using: "composite"
  steps:
    - name: "⚡ Setup pnpm and Node"
      uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
      with:
        version: "12.4.1"
        runtime: "node@24"
        cache: false
        install: false
    - name: "📍 Get pnpm store path"
      if: inputs.cache == 'true'
      id: "pnpm-store"
      shell: "bash"
      run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
    - name: "💾 Cache pnpm store"
      if: inputs.cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ github.job }}-${{ github.run_id }}
        restore-keys: |
          pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-

name: Create and scan sbom action
description: Creates and scans the sbom for security vulnerabilities

inputs:
  artifact-name:
    description: "The name of the sbom upload artifact"
    required: true
  current-version:
    description: "The version to generate the report for"
    required: true

runs:
  using: "composite"
  steps:
    - name: 📜 Create SBOM
      uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
      env:
        SYFT_SOURCE_NAME: ${{ github.event.repository.name }}
        SYFT_SOURCE_VERSION: ${{ inputs.current-version }}
      with:
        format: "spdx-json"
        output-file: "sbom.spdx.json"
        upload-artifact: false
        upload-release-assets: false

    - name: 🗜️ Compress SBOM
      shell: bash
      run: gzip -c sbom.spdx.json > sbom.spdx.json.gz

    - name: 📤 Upload SBOM artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: sbom.spdx.json.gz

    - name: 🔍 Scan SBOM
      id: scan
      uses: anchore/scan-action@8964e60c6fabdb85fdbbbfd9834d8f19c97a3086 # v7.4.1
      with:
        sbom: "sbom.spdx.json"
        severity-cutoff: medium
        cache-db: false

    - name: 🔍 Inspect SARIF report
      if: ${{ runner.os != 'Windows' }}
      shell: bash
      env:
        SARIF: ${{ steps.scan.outputs.sarif }}
      run: |
        jq . "$SARIF"

    - name: 🔍 Inspect SARIF report
      if: ${{ runner.os == 'Windows' }}
      shell: pwsh
      env:
        SARIF: ${{ steps.scan.outputs.sarif }}
      run: |
        jq . "$env:SARIF"

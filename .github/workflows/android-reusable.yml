name: "Reusable android workflow"

env:
  NDK_VERSION: 29.0.14206865

on:
  workflow_call:
    inputs:
      branch:
        required: false
        type: string
        default: ""
      tagName:
        required: false
        type: string
    secrets:
      ANDROID_RELEASE_KEYSTORE:
        required: false
      ANDROID_RELEASE_KEYSTORE_PASSWORD:
        required: false
      ANDROID_RELEASE_KEY:
        required: false
      ANDROID_RELEASE_KEY_PASSWORD:
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    name: 📦🔨
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tagName || github.ref }}
          fetch-depth: ${{ inputs.tagName && '0' || '1' }}
          persist-credentials: false
      - name: 🦀🚀
        uses: ./.github/actions/setup-rust-cache
        with:
          targets: ${{ inputs.tagName && 'aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android' || 'x86_64-linux-android' }}
          save-cache: ${{ inputs.branch == 'main' }}

      - name: 📝 Extract version from tauri.conf.json
        id: get-version
        run: |
          CURRENT_VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          echo "current-version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

      - name: 📜 Create and 🔍 scan SBOM for vulnerabilities
        uses: ./.github/actions/sbom
        with:
          artifact-name: "sbom.android.spdx.json.gz"
          current-version: ${{ steps.get-version.outputs.current-version }}

      - name: 🛠️🐂
        uses: ./.github/actions/setup-tauri

      - name: 🛠️ Add auditable cargo wrapper to PATH
        run: echo "$GITHUB_WORKSPACE/scripts" >> "$GITHUB_PATH"

      - name: ⚡ Setup pnpm and cache store
        uses: ./.github/actions/pnpm-setup

      - name: 📦 Install frontend dependencies
        uses: hrzlgnm/actions/.github/actions/retry@03b79955b43e4b4ae1678541e9d315d4f24c847d # v2.14.8
        with:
          command: pnpm install --frozen-lockfile

      - name: 🛠️🚀
        if: (!inputs.tagName)
        uses: ./.github/actions/setup-sccache

      - name: ☕ Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: "zulu"
          java-version: "17"

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          cmdline-tools-version: 15859902
          # The action defaults to `tools platform-tools`, but Google removed
          # the legacy `tools` package, so sdkmanager exits 1 on it.
          packages: platform-tools

      - name: 🛠️ Install NDK
        run: android sdk install "ndk;$NDK_VERSION"

      - name: 🔨 Build app bundle (debug x86_64 in PRs, release otherwise)
        shell: bash
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
          RUSTFLAGS: "-D warnings"
          TAG_NAME: ${{ inputs.tagName }}
          # Force tauri's package-manager detection down its pnpm branch:
          # since pnpm 12 (native binary) npm_execpath points at pnpm-native,
          # which would otherwise end up as the re-invocation command in
          # gen/android BuildTask.kt and fail to spawn under Gradle.
          PNPM_PACKAGE_NAME: mdns-browser-frontend
        run: |
          pnpm tauri android init
          cp -a src-tauri/icons/android/mipmap-* src-tauri/gen/android/app/src/main/res/
          if [[ -n "$TAG_NAME" ]]; then
            pnpm tauri android build
          else
            pnpm tauri android build --debug -t x86_64
          fi

      - name: 🔑 Extract android signing key
        if: inputs.tagName
        env:
          ANDROID_RELEASE_KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE }}
        run: |
          echo "$ANDROID_RELEASE_KEYSTORE" > src-tauri/gen/android/release.jks.base64
          base64 -d src-tauri/gen/android/release.jks.base64 > src-tauri/gen/android/release.decrypted.jks

      - name: 🔏 Sign APK
        if: inputs.tagName
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_RELEASE_KEY: ${{ secrets.ANDROID_RELEASE_KEY }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign --ks src-tauri/gen/android/release.decrypted.jks \
            --ks-key-alias "$ANDROID_RELEASE_KEY" \
            --ks-pass "pass:$ANDROID_RELEASE_KEYSTORE_PASSWORD" \
            --key-pass "pass:$ANDROID_RELEASE_KEY_PASSWORD" \
            --out src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-signed.apk \
            src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk

      - name: ✏️ Rename APK file
        if: inputs.tagName
        env:
          CURRENT_VERSION: ${{ steps.get-version.outputs.current-version }}
        run: |
          mv ./src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-signed.apk "./src-tauri/gen/android/app/build/outputs/apk/universal/release/mdns-browser_${CURRENT_VERSION}.apk"

      - name: 🚀 Publish (publish only)
        if: inputs.tagName
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tagName }}
          APK_FILE: src-tauri/gen/android/app/build/outputs/apk/universal/release/mdns-browser_${{ steps.get-version.outputs.current-version }}.apk
        run: |
          if [[ -n "$APK_FILE" && -f "$APK_FILE" ]]; then
            gh release upload "$TAG_NAME" "$APK_FILE" --clobber
          else
            echo "No release assets to upload for this platform"
            exit 1
          fi

      - name: 📤 Publish SBOM to release
        if: inputs.tagName
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tagName }}
        run: |
          cp sbom.spdx.json.gz sbom.android.spdx.json.gz
          gh release upload "$TAG_NAME" "sbom.android.spdx.json.gz" --clobber

      - name: 🛡️ Attest build provenance (publish only)
        if: inputs.tagName
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            src-tauri/gen/android/app/build/outputs/apk/universal/release/mdns-browser_${{ steps.get-version.outputs.current-version }}.apk

      - name: 🛡️ Attest SBOM (publish only)
        if: inputs.tagName
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: src-tauri/gen/android/app/build/outputs/apk/universal/release/mdns-browser_${{ steps.get-version.outputs.current-version }}.apk
          sbom-path: "sbom.spdx.json"

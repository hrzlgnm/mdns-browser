name: Publish webkit2gtk-nvidia-quirk

# Versions, tags, changelogs and GitHub releases are owned by
# release-please. This workflow only publishes an already-tagged
# release to crates.io.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. webkit2gtk-nvidia-quirk-v2.2.0)
        required: true
        type: string
      dry-run:
        description: Dry run (verify versions without publishing)
        required: true
        type: boolean
        default: false
      publish:
        description: Publish to crates.io after verification
        required: true
        type: boolean
        default: true

jobs:
  publish:
    permissions:
      contents: read
    uses: ./.github/workflows/publish-crate-reusable.yml
    with:
      tag: ${{ inputs.tag }}
      dry_run: ${{ inputs.dry-run }}
      publish: ${{ inputs.publish }}
      crate_name: webkit2gtk-nvidia-quirk
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

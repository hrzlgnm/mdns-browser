name: "Reusable ci lint workflow"

on:
  workflow_call:
  workflow_dispatch:

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: 🦀🚀
        uses: ./.github/actions/setup-rust-cache
        with:
          components: rustfmt

      - name: 📐 Run rustfmt and fail if any warnings
        shell: bash
        run: |
          cargo fmt -- --check
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

  prettier:
    runs-on: ubuntu-latest
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: ⚡ Setup pnpm and cache store
        uses: ./.github/actions/pnpm-setup

      - name: 📦 Install dependencies
        uses: hrzlgnm/actions/.github/actions/retry@275b5f2d90d762bd71567db08b250d8ba7cdb274 # v2.14.4
        with:
          command: pnpm install --frozen-lockfile

      - name: 🎨 Run prettier and fail if any warnings
        shell: bash
        run: |
          pnpm run format:check

  eslint:
    runs-on: ubuntu-latest
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: ⚡ Setup pnpm and cache store
        uses: ./.github/actions/pnpm-setup

      - name: 📦 Install dependencies
        uses: hrzlgnm/actions/.github/actions/retry@275b5f2d90d762bd71567db08b250d8ba7cdb274 # v2.14.4
        with:
          command: pnpm install --frozen-lockfile

      - name: 🧹 Run eslint and fail if any warnings
        shell: bash
        run: |
          pnpm run lint

  svelte-check:
    runs-on: ubuntu-latest
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: ⚡ Setup pnpm and cache store
        uses: ./.github/actions/pnpm-setup

      - name: 📦 Install dependencies
        uses: hrzlgnm/actions/.github/actions/retry@275b5f2d90d762bd71567db08b250d8ba7cdb274 # v2.14.4
        with:
          command: pnpm install --frozen-lockfile

      - name: 🔍 Run svelte-check and fail if any warnings
        shell: bash
        run: |
          pnpm run check

  types-drift:
    runs-on: ubuntu-latest
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: 🦀🚀
        uses: ./.github/actions/setup-rust-cache

      - name: ⚡ Setup pnpm and cache store
        uses: ./.github/actions/pnpm-setup

      - name: 📦 Install dependencies
        uses: hrzlgnm/actions/.github/actions/retry@275b5f2d90d762bd71567db08b250d8ba7cdb274 # v2.14.4
        with:
          command: pnpm install --frozen-lockfile

      - name: 📝 Regenerate types and fail on drift
        shell: bash
        run: |
          ./scripts/export-types.sh
          git diff --exit-code src/lib/types.ts

  clippy:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: "ubuntu-latest"
            symbol: 🐧
            platform: Linux
            container_image: ghcr.io/hrzlgnm/mdns-browser-ubuntu-builder:v1@sha256:919e8043c798855b86062209377324bd08851c26c3d076684873a486c395c6eb
          - os: "macos-latest"
            symbol: 🍏
          - os: "windows-latest"
            symbol: 🪟
    runs-on: ${{matrix.os}}
    name: ${{matrix.symbol}}📎
    container: ${{ contains(matrix.os, 'ubuntu') && matrix.container_image || null }}
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: 🦀🚀
        uses: ./.github/actions/setup-rust-cache
        with:
          components: clippy
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # Clippy emits metadata only, which sccache cannot cache.
      - name: 📎 Run clippy and fail if any warnings
        shell: bash
        run: |
          cargo clippy --workspace --tests -- -D warnings

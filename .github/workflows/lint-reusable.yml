name: "Reusable ci lint workflow"

on:
  workflow_call:
  workflow_dispatch:

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: 🦀🚀
        uses: ./.github/actions/setup-rust-cache
        with:
          components: rustfmt

      - name: 📐 Run rustfmt and fail if any warnings
        shell: bash
        working-directory: src-tauri
        run: |
          cargo fmt -- --check

  prettier:
    runs-on: ubuntu-latest
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: ⚡ Setup pnpm and cache store
        uses: ./.github/actions/pnpm-setup

      - name: 📦 Install dependencies
        uses: hrzlgnm/actions/.github/actions/retry@c4634c8090f9c2941bbad01a692e2dd4fc91416c # v2.14.10
        with:
          command: pnpm install --frozen-lockfile

      - name: 🎨 Run prettier and fail if any warnings
        shell: bash
        run: |
          pnpm run format:check

  eslint:
    runs-on: ubuntu-latest
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: ⚡ Setup pnpm and cache store
        uses: ./.github/actions/pnpm-setup

      - name: 📦 Install dependencies
        uses: hrzlgnm/actions/.github/actions/retry@c4634c8090f9c2941bbad01a692e2dd4fc91416c # v2.14.10
        with:
          command: pnpm install --frozen-lockfile

      - name: 🧹 Run eslint and fail if any warnings
        shell: bash
        run: |
          pnpm run lint

  svelte-check:
    runs-on: ubuntu-latest
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: ⚡ Setup pnpm and cache store
        uses: ./.github/actions/pnpm-setup

      - name: 📦 Install dependencies
        uses: hrzlgnm/actions/.github/actions/retry@c4634c8090f9c2941bbad01a692e2dd4fc91416c # v2.14.10
        with:
          command: pnpm install --frozen-lockfile

      - name: 🔍 Run svelte-check and fail if any warnings
        shell: bash
        run: |
          pnpm run check

  clippy:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: "ubuntu-latest"
            symbol: 🐧
            platform: Linux
            container_image: ghcr.io/hrzlgnm/mdns-browser-ubuntu-builder:v1@sha256:064b32d4ac8fe36fc308f3b12170616c5879f0cd6e4a365c3db5e7a9161f9693
          - os: "macos-latest"
            symbol: 🍏
          - os: "windows-latest"
            symbol: 🪟
    runs-on: ${{matrix.os}}
    name: ${{matrix.symbol}}📎
    container: ${{ contains(matrix.os, 'ubuntu') && matrix.container_image || null }}
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: 🦀🚀
        uses: ./.github/actions/setup-rust-cache
        with:
          components: clippy
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # Clippy emits metadata only, which sccache cannot cache.
      - name: 📎 Run clippy and fail if any warnings
        shell: bash
        working-directory: src-tauri
        run: |
          cargo clippy --workspace --tests -- -D warnings

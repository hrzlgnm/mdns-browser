name: Update Homebrew Tap

on:
  workflow_call:
  workflow_dispatch:
  release:
    types: [released]

jobs:
  release-info:
    permissions:
      packages: read # needed to read release info from GitHub Packages
    runs-on: ubuntu-slim
    outputs:
      version: ${{ steps.version.outputs.version }}
      tagName: ${{ steps.version.outputs.tagName }}
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: 🏷️ Get version info
        id: version
        uses: ./.github/actions/latest-release-info

  update-homebrew-tap:
    needs: [release-info]
    runs-on: ubuntu-latest
    name: 🍺 Update Homebrew Tap
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: 🔄 Checkout Tap Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: hrzlgnm/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: 📥 Download DMG Checksum
        uses: hrzlgnm/actions/.github/actions/retry@0bc72278fc09aa8093f47c430e6e52cf9321e14b # v2.14.1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-info.outputs.tagName }}
        with:
          command: |
            CHECKSUM=$(gh release view "$TAG" --repo hrzlgnm/mdns-browser --json assets --jq '.assets[] | select(.name | endswith(".dmg")) | select(.name | test("universal"; "i")) | select(.name | test("\\.sha256$") | not) | .digest')
            if [ -z "$CHECKSUM" ]; then
              echo "Error: No checksum found for universal.dmg in release $TAG"
              exit 1
            fi
            # strip prefix sha256:
            CHECKSUM="${CHECKSUM#sha256:}"
            echo "DMG_CHECKSUM=$CHECKSUM" >> "$GITHUB_ENV"

      - name: 🔑 Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 🔄 Update Cask Version & SHA256
        shell: bash
        env:
          NEW_VERSION: ${{ needs.release-info.outputs.version }}
          CHECKSUM: ${{ env.DMG_CHECKSUM }}
          CASK_PATH: homebrew-tap/Casks/mdns-browser.rb
        run: |
          sed -i "s/version \".*\"/version \"$NEW_VERSION\"/" "$CASK_PATH"
          sed -i "s/sha256 \".*\"/sha256 \"$CHECKSUM\"/" "$CASK_PATH"

      - name: 💾 Commit & Push to Tap
        uses: hrzlgnm/actions/.github/actions/retry@0bc72278fc09aa8093f47c430e6e52cf9321e14b # v2.14.1
        env:
          VERSION: ${{ needs.release-info.outputs.version }}
        with:
          command: |
            cd homebrew-tap
            git add Casks/mdns-browser.rb
            if ! git diff --cached --quiet; then
              git commit -m "chore: update mdns-browser to v$VERSION"
            else
              echo "No staged changes (already committed on previous retry or no update needed)"
            fi
            git push

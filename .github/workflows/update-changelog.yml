name: "📝 Update Changelog"

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write # Needed to commit and push to the update branch
  pull-requests: write # Needed to create/update the pull request

concurrency:
  group: update-changelog
  cancel-in-progress: true

jobs:
  update-changelog:
    name: "📝 Update Unreleased Changelog"
    runs-on: ubuntu-slim
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: 🦀 Install Rust toolchain for git-cliff build fallback
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: 🔧 Install git-cliff
        uses: baptiste0928/cargo-install@f204293d9709061b7bc1756fec3ec4e2cd57dec0 # v3
        with:
          crate: git-cliff
          version: 2.13.1
          locked: true

      - name: 📝 Generate changelog
        run: |
          git-cliff --output CHANGELOG.md
          git-cliff --config cliff-webkit2gtk.toml --output crates/webkit2gtk-nvidia-quirk/CHANGELOG.md

      - name: 🔍 Check for changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet CHANGELOG.md crates/webkit2gtk-nvidia-quirk/CHANGELOG.md; then
            echo "No changes to changelog"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 🖋️ Commit changelog as github-actions[bot]
        if: steps.changes.outputs.changed == 'true'
        uses: ryancyq/github-signed-commit@cb9b21ee83578fe8e26a9eda530015aedf0c7c5b # v1.4.1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            CHANGELOG.md
            crates/webkit2gtk-nvidia-quirk/CHANGELOG.md
          commit-message: "chore(version): update unreleased changelog"
          branch-name: chore/update-changelog
          branch-push-force: true

      - name: 🔁 Create or update Pull Request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="chore/update-changelog"
          if [ "$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')" = "0" ]; then
            gh pr create \
              --title "chore: update unreleased changelog" \
              --body "Automated update of the \`[Unreleased]\` section in \`CHANGELOG.md\`.

          This PR is created automatically on a nightly schedule
          by running \`git-cliff\` without a version tag." \
              --label ignore
          fi

          gh pr merge "$BRANCH" --auto --squash

  approve-bot-pr:
    if: needs.update-changelog.outputs.changed == 'true'
    needs: update-changelog
    permissions:
      actions: write
      contents: read
      pull-requests: read
    uses: hrzlgnm/actions/.github/workflows/approve-bot-pr-reusable.yml@1847f299d36e715acd93d4bc496b9faab29a4c94 # v2.6.0
    with:
      branch: chore/update-changelog

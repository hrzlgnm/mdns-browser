name: Publish tauri-plugin-android-update

# Versions, tags, changelogs and GitHub releases are owned by
# release-please. This workflow only publishes an already-tagged
# release to crates.io and npm.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. tauri-plugin-android-update-v0.3.0)
        required: true
        type: string
      dry-run:
        description: Dry run (verify versions without publishing)
        required: true
        type: boolean
        default: false
      publish:
        description: Publish to crates.io after verification
        required: true
        type: boolean
        default: true

jobs:
  publish:
    permissions:
      contents: read
      id-token: write # required for npm trusted publishing (OIDC) in the reusable workflow
    uses: ./.github/workflows/publish-crate-reusable.yml
    with:
      tag: ${{ inputs.tag }}
      dry_run: ${{ inputs.dry-run }}
      publish: ${{ inputs.publish }}
      crate_name: tauri-plugin-android-update
      npm_package_dir: crates/tauri-plugin-android-update
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

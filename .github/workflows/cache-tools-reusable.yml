name: "Reusable cache tools for release workflow"

on:
  workflow_call:
  workflow_dispatch:

jobs:
  cache-tools:
    runs-on: ubuntu-latest
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: 🦀🚀
        uses: ./.github/actions/setup-rust-cache
        with:
          save-cache: false

      # Ensure tools used in release workflow are in the cache

      - name: 🔧 Install komac
        uses: baptiste0928/cargo-install@8195d4f734a149db85385bb4102b42efcd373759 # v3
        with:
          crate: komac
          version: 2.16.0
          locked: true

  cache-platform-tools:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: "ubuntu-latest"
            symbol: 🐧
            platform: Linux
            container_image: ghcr.io/hrzlgnm/mdns-browser-ubuntu-builder:v1@sha256:715bfd8546d1b96f023d2b153c7cb146959d1d8247150a28069c34b88906a5e2
          - os: "macos-latest"
            symbol: 🍏
            platform: macOS
          - os: "windows-latest"
            symbol: 🪟
            platform: Windows

    name: ${{matrix.symbol}}🔨
    runs-on: ${{matrix.os}}
    container: ${{ matrix.container_image || '' }}
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: 🦀🚀
        uses: ./.github/actions/setup-rust-cache
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: 🛠️🐂
        uses: ./.github/actions/setup-tauri

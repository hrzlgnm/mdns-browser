name: Arch linux AUR

on:
  workflow_call:
  workflow_dispatch:
  release:
    types: [released]

jobs:
  release-info:
    permissions:
      packages: read # needed to read release info from GitHub Packages
    runs-on: ubuntu-slim
    outputs:
      version: ${{ steps.version.outputs.version }}
      tagName: ${{ steps.version.outputs.tagName }}
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: 🏷️ Get version info
        id: version
        uses: ./.github/actions/latest-release-info

  update-aur:
    needs:
      - release-info
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/hrzlgnm/mdns-browser-arch-aur-builder:v1@sha256:de0c834a50cc00374762406c5da64063505e98979d748084fcf1b850531c70c4
    strategy:
      fail-fast: false
      matrix:
        package:
          - name: mdns-browser-bin
            needs_exe: "true"
            generate_script: "./packaging/aur/generate-mdns-browser-bin.sh"
          - name: mdns-browser
            needs_exe: "false"
            generate_script: "./packaging/aur/generate-mdns-browser.sh"
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: 🔢 Get sha256sums
        id: sha256sums
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-info.outputs.tagName }}
        run: |
          if [[ "${{ matrix.package.name }}" == "mdns-browser-bin" ]]; then
            ASSETS=$(gh release view "$TAG_NAME" --repo hrzlgnm/mdns-browser --json assets --jq '.assets | map(select(.name | test("\\.sha256$") | not))')
            SUM=$(echo "$ASSETS" | jq -r --arg name "mdns-browser_${{ needs.release-info.outputs.version }}_amd64.deb" '.[] | select(.name == $name) | .digest')
            if [[ -z "$SUM" ]]; then
              echo "Error: Failed to get checksum from GitHub API for release $TAG_NAME"
              exit 1
            fi
            echo "sha256=$SUM" >> "$GITHUB_OUTPUT"
            if [[ "${{ matrix.package.needs_exe }}" == "true" ]]; then
              SUM_EXE=$(echo "$ASSETS" | jq -r --arg name "mdns-browser_linux_x64" '.[] | select(.name == $name) | .digest')
              if [[ -z "$SUM_EXE" ]]; then
                echo "Error: Failed to get exe checksum from GitHub API for release $TAG_NAME"
                exit 1
              fi
              echo "sha256_exe=$SUM_EXE" >> "$GITHUB_OUTPUT"
            fi
          else
            URL="https://github.com/hrzlgnm/mdns-browser/releases/download/$TAG_NAME/mdns-browser-v${{ needs.release-info.outputs.version }}.tar.gz.sha256"
            echo "getting $URL"
            SUM=$(curl -LfsS "$URL" | cut -d' ' -f1)
            echo "sha256=$SUM" >> "$GITHUB_OUTPUT"
          fi

      - name: 📐 Lint generated PKGBUILD
        shell: bash
        run: |
          su runner -c "
            set -o errexit
            mkdir -p ~/lint
            o=\$(pwd)
            EXE_CHECKSUM=\"${{ steps.sha256sums.outputs.sha256_exe }}\"
            ${{ matrix.package.generate_script }} \"${{ needs.release-info.outputs.version }}\" \"${{ steps.sha256sums.outputs.sha256 }}\" \"\${EXE_CHECKSUM:-}\" > ~/lint/PKGBUILD
            cd ~/lint
            \"\$o/packaging/aur/makepkg-lint.sh\"
          "
      - name: 🛠️ Setup Deployment keys
        if: github.event.release.tag_name
        shell: bash
        env:
          AUR_DEPLOY_KEY: ${{ secrets.AUR_DEPLOY_KEY }}
        run: |
          chown -R runner:runner .
          su runner -c "
            set -o errexit
            mkdir -p ~/.ssh
            printf '%s\n' \"\$AUR_DEPLOY_KEY\" > ~/.ssh/aur
            chmod 600 ~/.ssh/aur
            echo \"Host aur.archlinux.org\" >> ~/.ssh/config
            echo \"  IdentityFile ~/.ssh/aur\" >> ~/.ssh/config
            echo \"  User aur\" >> ~/.ssh/config
            ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts
          "

      - name: 🔄 Clone AUR Repo
        if: github.event.release.tag_name
        shell: bash
        run: |
          su runner -c "
            set -o errexit
            git clone --depth=1 \"ssh://aur@aur.archlinux.org/${{ matrix.package.name }}.git\" ~/aur
          "

      - name: 🔍 Check version
        if: github.event.release.tag_name
        shell: bash
        run: |
          su runner -c "
            set -o errexit
            cd ~/aur
            if [[ -f PKGBUILD ]]; then
              CURRENT_VERSION=\$(source PKGBUILD && echo \$pkgver)
              if [[ \"\$(printf \"%s\n%s\" \"\$CURRENT_VERSION\" \"${{ needs.release-info.outputs.version }}\" | sort -V | head -n1)\" != \"\$CURRENT_VERSION\" ]] || [[ \"\$CURRENT_VERSION\" == \"${{ needs.release-info.outputs.version }}\" ]]; then
                echo \"New version (${{ needs.release-info.outputs.version }}) is not higher than the current version (\$CURRENT_VERSION). Exiting.\"
                exit 1
              fi
            fi
          "

      - name: 🌀 Generate PKGBUILD update and publish
        if: github.event.release.tag_name
        run: |
          su runner -c "
            set -o errexit
            EXE_CHECKSUM=\"${{ steps.sha256sums.outputs.sha256_exe }}\"
            ${{ matrix.package.generate_script }} \"${{ needs.release-info.outputs.version }}\" \"${{ steps.sha256sums.outputs.sha256 }}\" \"\${EXE_CHECKSUM:-}\" > ~/aur/PKGBUILD
            cd ~/aur
            if [[ -z \$(git status --porcelain) ]]; then
              echo \"No changes\"
              exit 0
            fi
            makepkg --printsrcinfo > .SRCINFO
            makepkg
            makepkg --install --noconfirm
            git config user.name \"hrzlgnm\"
            git config user.email \"hrzlgnm@users.noreply.github.com\"
            git add PKGBUILD .SRCINFO
            git commit -m \"New upstream release ${{ needs.release-info.outputs.version }}\"
            git push origin master
          "

name: Arch linux AUR

on:
  workflow_call:
  workflow_dispatch:
  release:
    types: [released]

jobs:
  release-info:
    permissions:
      packages: read # needed to read release info from GitHub Packages
    runs-on: ubuntu-slim
    outputs:
      version: ${{ steps.version.outputs.version }}
      tagName: ${{ steps.version.outputs.tagName }}
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: 🏷️ Get version info
        id: version
        uses: ./.github/actions/latest-release-info

  lint-scripts:
    name: "🧹 Lint shell scripts"
    uses: hrzlgnm/actions/.github/workflows/shell-lint-reusable.yml@f85e921e2b4249d5b5b4eca7845481a382fb7a54 # v2.13.1
    with:
      runs-on: ubuntu-latest
      scripts-dir: packaging/aur

  update-aur:
    needs:
      - release-info
      - lint-scripts
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/hrzlgnm/mdns-browser-arch-aur-builder:v1@sha256:d344e8162f5bcf9bb52750adee123f17eeaa565138bf75096b58e97bad00db0e
    strategy:
      fail-fast: false
      matrix:
        package:
          - name: mdns-browser-bin
            needs_exe: "true"
            generate_script: "./packaging/aur/generate-mdns-browser-bin.sh"
          - name: mdns-browser
            needs_exe: "false"
            generate_script: "./packaging/aur/generate-mdns-browser.sh"
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: 🔢 Get sha256sums
        id: sha256sums
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-info.outputs.tagName }}
          PACKAGE_NAME: ${{ matrix.package.name }}
          RELEASE_VERSION: ${{ needs.release-info.outputs.version }}
          NEEDS_EXE: ${{ matrix.package.needs_exe }}
        with:
          timeout_minutes: 5
          max_attempts: 5
          retry_wait_seconds: 10
          warning_on_retry: true
          command: ./packaging/aur/resolve-sha256.sh

      - name: 📐 Generate PKGBUILD
        uses: hrzlgnm/actions/.github/actions/retry@f85e921e2b4249d5b5b4eca7845481a382fb7a54 # v2.13.1
        env:
          SHA256_EXE: ${{ steps.sha256sums.outputs.sha256_exe }}
          TAG_NAME: ${{ needs.release-info.outputs.tagName }}
          NEEDS_EXE: ${{ matrix.package.needs_exe }}
          GENERATE_SCRIPT: ${{ matrix.package.generate_script }}
          RELEASE_VERSION: ${{ needs.release-info.outputs.version }}
          SHA256: ${{ steps.sha256sums.outputs.sha256 }}
        with:
          # su without --login keeps the step env and only resets
          # HOME/SHELL/USER/LOGNAME, so the script reads inputs from env.
          command: su runner -c "./packaging/aur/lint-pkgbuild.sh"

      - name: 🧹 Check generated PKGBUILD
        uses: hrzlgnm/actions/.github/actions/aur-makepkg-lint@f85e921e2b4249d5b5b4eca7845481a382fb7a54 # v2.13.1
        with:
          workdir: ~/lint
      - name: 🛠️ Setup AUR packaging
        if: github.event.release.tag_name
        uses: hrzlgnm/actions/.github/actions/aur-setup@f85e921e2b4249d5b5b4eca7845481a382fb7a54 # v2.13.1
        with:
          package-name: ${{ matrix.package.name }}
          release-version: ${{ needs.release-info.outputs.version }}
          deploy-key: ${{ secrets.AUR_DEPLOY_KEY }}

      - name: 🌀 Generate PKGBUILD update and publish
        if: github.event.release.tag_name
        uses: hrzlgnm/actions/.github/actions/retry@f85e921e2b4249d5b5b4eca7845481a382fb7a54 # v2.13.1
        env:
          SHA256_EXE: ${{ steps.sha256sums.outputs.sha256_exe }}
          TAG_NAME: ${{ needs.release-info.outputs.tagName }}
          NEEDS_EXE: ${{ matrix.package.needs_exe }}
          GENERATE_SCRIPT: ${{ matrix.package.generate_script }}
          RELEASE_VERSION: ${{ needs.release-info.outputs.version }}
          SHA256: ${{ steps.sha256sums.outputs.sha256 }}
        with:
          command: su runner -c "./packaging/aur/publish-aur.sh"

name: "Reusable desktop tauri build workflow"

on:
  workflow_call:
    inputs:
      branch:
        required: false
        type: string
        default: ""
      tagName:
        required: false
        type: string
    secrets:
      TAURI_PRIVATE_KEY:
        required: true
      TAURI_KEY_PASSWORD:
        required: true
      WINDOWS_CERTIFICATE:
        required: false
      WINDOWS_CERTIFICATE_PASSWORD:
        required: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: "ubuntu-latest"
            symbol: 🐧
            platform: Linux
            container_image: ghcr.io/hrzlgnm/mdns-browser-ubuntu-builder:v1@sha256:b7b5414a252e217137da75de5c36cc78088a9662752e5682088645beee891078
          - os: "macos-latest"
            args: "--target universal-apple-darwin"
            symbol: 🍏
            platform: macOS
          - os: "windows-latest"
            symbol: 🪟
            platform: Windows

    name: ${{matrix.symbol}}🔨
    runs-on: ${{matrix.os}}
    container: ${{ contains(matrix.os, 'ubuntu') && matrix.container_image || null }}
    steps:
      - name: 🔧 Configure Git safe directory
        if: contains(matrix.os, 'ubuntu')
        run: |
          git config --global --add safe.directory /__w/mdns-browser/mdns-browser

      - name: 🔄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tagName || github.ref }}
          fetch-depth: ${{ inputs.tagName && '0' || '1' }}
          persist-credentials: false

      - name: 🦀🚀
        uses: ./.github/actions/setup-rust-cache
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
          save-cache: ${{ inputs.branch == 'main' }}

      - name: 📝 Extract version from tauri.conf.json
        id: get-version
        shell: bash
        run: |
          CURRENT_VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          echo "current-version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

      - name: 📜 Create and 🔍 scan SBOM for vulnerabilities
        uses: ./.github/actions/sbom
        with:
          artifact-name: "sbom.${{ matrix.platform }}.spdx.json.gz"
          current-version: ${{ steps.get-version.outputs.current-version }}

      - name: 🛠️🐂
        uses: ./.github/actions/setup-tauri

      - name: 🛠️ Add auditable cargo wrapper to PATH
        shell: bash
        run: echo "$GITHUB_WORKSPACE/scripts" >> "$GITHUB_PATH"

      - name: ⚡ Setup pnpm and cache store
        uses: ./.github/actions/pnpm-setup

      - name: 📦 Install frontend dependencies
        uses: hrzlgnm/actions/.github/actions/retry@0bb9559803ab259be48398d4137dcec658d45bf9 # v2.14.9
        with:
          command: pnpm install --frozen-lockfile

      - name: 🛠️🚀
        if: (!inputs.tagName)
        uses: ./.github/actions/setup-sccache

      - name: 🔑 Import windows signing certificate (windows only)
        if: contains(matrix.os, 'windows')
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          New-Item -ItemType directory -Path certificate
          Set-Content -Path certificate/tempCert.txt -Value $env:WINDOWS_CERTIFICATE
          certutil -decode certificate/tempCert.txt certificate/certificate.pfx
          Remove-Item -path certificate -include tempCert.txt
          Import-PfxCertificate -FilePath certificate/certificate.pfx -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText)

      - name: 📋 Get current release body
        if: inputs.tagName
        id: current-release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tagName }}
        run: |
          {
            echo "body<<BODYEOF"
            curl -sSL \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$TAG_NAME" \
              | jq -r '.body // empty'
            echo "BODYEOF"
          } >> "$GITHUB_OUTPUT"

      - name: 🔨 Build executables using tauri action (debug in PRs, release otherwise)
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          RUSTFLAGS: "-D warnings"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: ${{ inputs.tagName }}
          releaseName: "mDNS-Browser v${{ steps.get-version.outputs.current-version }}"
          releaseBody: ${{ steps.current-release.outputs.body }}
          releaseDraft: true
          prerelease: false
          tauriScript: pnpm tauri
          args: ${{ matrix.args }} --no-bundle${{ !inputs.tagName && ' --debug' || '' }}
          retryAttempts: 1
          uploadPlainBinary: true

      - name: 🛡️ Attest build provenance (plain binary)
        if: inputs.tagName
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            src-tauri/target/**/release/mdns-browser
            src-tauri/target/release/mdns-browser.exe

      - name: 🛡️ Attest SBOM (plain binary)
        if: inputs.tagName
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            src-tauri/target/**/release/mdns-browser
            src-tauri/target/release/mdns-browser.exe
          sbom-path: "sbom.spdx.json"

      - name: 🔨 Build bundles using tauri action (release only)
        if: inputs.tagName
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          RUSTFLAGS: "-D warnings"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          updaterJsonPreferNsis: true
          tagName: ${{ inputs.tagName }}
          releaseName: "mDNS-Browser v${{ steps.get-version.outputs.current-version }}"
          releaseBody: ${{ steps.current-release.outputs.body }}
          releaseDraft: true
          prerelease: false
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          retryAttempts: 1

      - name: 📦 Compress debug symbols (Windows)
        if: inputs.tagName && contains(matrix.os, 'windows')
        shell: pwsh
        env:
          VERSION: ${{ steps.get-version.outputs.current-version }}
        run: |
          Compress-Archive -Path "src-tauri/target/release/mdns_browser.pdb" -DestinationPath "src-tauri/target/release/mdns-browser-$env:VERSION-debug-symbols-windows.zip" -Force
          Write-Output "Compressed src-tauri/target/release/mdns_browser.pdb -> src-tauri/target/release/mdns-browser-$env:VERSION-debug-symbols-windows.zip"

      - name: 📦 Compress debug symbols (Linux)
        if: inputs.tagName && contains(matrix.os, 'ubuntu')
        shell: bash
        env:
          VERSION: ${{ steps.get-version.outputs.current-version }}
        run: |
          tar -czf "src-tauri/target/release/mdns-browser-$VERSION-debug-symbols-linux.tar.gz" -C src-tauri/target/release mdns-browser.dwp
          echo "Compressed src-tauri/target/release/mdns-browser.dwp -> src-tauri/target/release/mdns-browser-$VERSION-debug-symbols-linux.tar.gz"

      - name: 📦 Compress debug symbols (macOS)
        if: inputs.tagName && contains(matrix.os, 'macos')
        shell: bash
        env:
          VERSION: ${{ steps.get-version.outputs.current-version }}
        run: |
          for ARCH in x86_64-apple-darwin aarch64-apple-darwin; do
            DSYM_LINK="src-tauri/target/$ARCH/release/mdns-browser.dSYM"
            if [ ! -L "$DSYM_LINK" ]; then
              echo "Error: dSYM symlink not found for $ARCH: $DSYM_LINK" >&2
              exit 1
            fi
            REAL_DSYM=$(readlink -f "$DSYM_LINK")
            if [ -z "$REAL_DSYM" ] || [ ! -e "$REAL_DSYM" ]; then
              echo "Error: dSYM symlink does not resolve for $ARCH: $DSYM_LINK -> $REAL_DSYM" >&2
              exit 1
            fi
            BASE=$(basename "$REAL_DSYM")
            INFIX="${ARCH//-apple-darwin/}"
            tar -czf "src-tauri/target/$ARCH/release/deps/mdns-browser-$VERSION-debug-symbols-macos-$INFIX.tar.gz" -C "src-tauri/target/$ARCH/release/deps" "$BASE"
            echo "Compressed $REAL_DSYM -> src-tauri/target/$ARCH/release/deps/mdns-browser-$VERSION-debug-symbols-macos-$INFIX.tar.gz"
          done

      - name: 🛑 Prepare debug symbol paths
        id: debug-symbols
        if: inputs.tagName
        shell: bash
        env:
          VERSION: ${{ steps.get-version.outputs.current-version }}
        run: |
          {
            echo "paths<<EOF"
            echo "src-tauri/target/release/mdns-browser-$VERSION-debug-symbols-windows.zip"
            echo "src-tauri/target/release/mdns-browser-$VERSION-debug-symbols-linux.tar.gz"
            echo "src-tauri/target/x86_64-apple-darwin/release/deps/mdns-browser-$VERSION-debug-symbols-macos-x86_64.tar.gz"
            echo "src-tauri/target/aarch64-apple-darwin/release/deps/mdns-browser-$VERSION-debug-symbols-macos-aarch64.tar.gz"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 📤 Publish debug symbols to release
        if: inputs.tagName
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tagName }}
          VERSION: ${{ steps.get-version.outputs.current-version }}
        run: |
          ASSETS=()
          for file in \
            "src-tauri/target/release/mdns-browser-$VERSION-debug-symbols-windows.zip" \
            "src-tauri/target/release/mdns-browser-$VERSION-debug-symbols-linux.tar.gz" \
            "src-tauri/target/x86_64-apple-darwin/release/deps/mdns-browser-$VERSION-debug-symbols-macos-x86_64.tar.gz" \
            "src-tauri/target/aarch64-apple-darwin/release/deps/mdns-browser-$VERSION-debug-symbols-macos-aarch64.tar.gz"; do
            if [[ -n "$file" && -f "$file" ]]; then
              ASSETS+=("$file")
            fi
          done
          if [ "${#ASSETS[@]}" -eq 0 ]; then
            echo "No release assets to upload for this platform"
            exit 1
          fi
          gh release upload "$TAG_NAME" "${ASSETS[@]}" --clobber

      - name: 📤 Publish SBOM to release
        if: inputs.tagName
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tagName }}
          SBOM_PLATFORM: ${{ matrix.platform }}
        run: |
          SBOM_FILE="sbom.${SBOM_PLATFORM}.spdx.json.gz"
          cp sbom.spdx.json.gz "$SBOM_FILE"
          gh release upload "$TAG_NAME" "$SBOM_FILE" --clobber

      - name: 🛡️ Attest build provenance (bundles)
        if: inputs.tagName
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            src-tauri/target/release/bundle/nsis/*
            src-tauri/target/release/bundle/msi/*
            src-tauri/target/**/release/bundle/macos/*.tar.gz*
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/mdns_browser.pdb
            src-tauri/target/release/mdns-browser-${{ steps.get-version.outputs.current-version }}-debug-symbols-windows.zip
            src-tauri/target/release/mdns-browser.dwp
            src-tauri/target/release/mdns-browser-${{ steps.get-version.outputs.current-version }}-debug-symbols-linux.tar.gz
            src-tauri/target/x86_64-apple-darwin/release/deps/mdns-browser-*.dSYM
            src-tauri/target/x86_64-apple-darwin/release/deps/mdns-browser-${{ steps.get-version.outputs.current-version }}-debug-symbols-macos-x86_64.tar.gz
            src-tauri/target/aarch64-apple-darwin/release/deps/mdns-browser-*.dSYM
            src-tauri/target/aarch64-apple-darwin/release/deps/mdns-browser-${{ steps.get-version.outputs.current-version }}-debug-symbols-macos-aarch64.tar.gz

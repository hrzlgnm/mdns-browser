name: "CI"

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  # measure against bitrot
  # also rotates docker images monthly, by pushing new docker images
  # the rotation will happen by renovate
  # rotate the images in the middle of the month,
  # to avoid duplicate rotations at the beginning of the month,
  # as the source docker images are also mostly rotated once a month
  schedule:
    - cron: "0 0 15 * *"

env:
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

concurrency:
  # On main, we want all builds to complete even if merging happens faster to make it easier to discover at which point something broke.
  group: ${{ github.ref == 'refs/heads/main' && format('ci-main-{0}', github.sha) || format('ci-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  label-pr:
    if: github.event_name == 'pull_request'
    name: "🏷️ Label PR"
    permissions:
      contents: read # needed to read repository contents for labeler config
      pull-requests: write # needed to apply labels to PRs
      issues: write # needed to create non-existing labels
    runs-on: ubuntu-slim

    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          configuration-path: .github/labeler.yml

  check-release:
    name: "🏷️ Check release tag"
    runs-on: ubuntu-slim
    outputs:
      is_release: ${{ steps.check.outputs.is_release }}
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          fetch-tags: true
          persist-credentials: false

      - name: 🏷️ Check for release
        id: check
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          is_release=false
          if [ "$EVENT_NAME" = "push" ]; then
            # The tag does not exist yet when CI starts: release-please
            # creates it after this same push, so fall back to matching
            # the release-please commit message.
            if git tag --points-at HEAD | grep -q '^v'; then
              is_release=true
            elif git log -1 --pretty=%B | grep -qE '^chore(\(main\))?: release '; then
              is_release=true
            fi
          fi
          echo "is_release=$is_release" >> "$GITHUB_OUTPUT"

  changes:
    name: "🔍 Detect Changes"
    needs:
      - check-release
    if: needs.check-release.outputs.is_release != 'true'
    runs-on: ubuntu-slim
    outputs:
      android: ${{ steps.filter.outputs.android }}
      aur: ${{ steps.filter.outputs.aur }}
      branch: ${{ steps.branch.outputs.branch }}
      desktop: ${{ steps.filter.outputs.desktop }}
      docker: ${{ steps.filter.outputs.docker }}
      lint: ${{ steps.filter.outputs.lint }}
      tauri: ${{ steps.filter.outputs.tauri }}
      tests: ${{ steps.filter.outputs.tests }}
      winget: ${{ steps.filter.outputs.winget }}
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: 🔍 Check for changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            android:
              - '.github/actions/sbom/**'
              - '.github/workflows/android-reusable.yml'
              - 'src-tauri/capabilities/mobile.json'
              - 'src-tauri/icons/icon.png'
              - 'src-tauri/tauri.android.conf.json'
              - 'src-tauri/tauri.conf.json'
            aur:
              - '.github/workflows/aur-reusable.yml'
              - '.github/actions/latest-release-info/action.yml'
              - 'packaging/aur/**'
            desktop:
              - '.github/actions/sbom/**'
              - '.github/workflows/desktop-reusable.yml'
              - 'src-tauri/capabilities/migrated.json'
              - 'src-tauri/icons/*.icns'
              - 'src-tauri/icons/*.ico'
              - 'src-tauri/icons/*.png'
              - 'src-tauri/icons/*.svg'
              - 'src-tauri/tauri.conf.json'
            docker:
              - '.github/docker/**'
            tauri:
              - '.github/actions/setup-*/**'
              - 'src-tauri/crates/**/src/**'
              - 'src-tauri/crates/**/Cargo.toml'
              - 'src/**'
              - 'static/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'svelte.config.js'
              - 'vite.config.js'
              - 'tsconfig.json'
              - 'eslint.config.js'
              - 'src-tauri/crates/models/src/lib.rs'
              - 'src-tauri/Cargo.toml'
              - 'src-tauri/Cargo.lock'
              - 'src-tauri/src/**'
              - 'src-tauri/build.rs'
            lint:
              - '.github/workflows/lint-reusable.yml'
            tests:
              - '.github/workflows/test-reusable.yml'
              - 'src-tauri/.config/nextest.toml'
            winget:
              - '.github/workflows/winget-reusable.yml'
              - '.github/actions/latest-release-info/action.yml'

      - name: Output branch name
        id: branch
        run: |
          echo "branch=$BRANCH_NAME" >> "$GITHUB_OUTPUT"

  typos:
    name: 📝 Check typos
    needs:
      - check-release
    if: always() && needs.check-release.outputs.is_release != 'true'
    uses: hrzlgnm/actions/.github/workflows/typos-reusable.yml@03b79955b43e4b4ae1678541e9d315d4f24c847d # v2.14.8

  actionlint:
    needs:
      - check-release
    if: always() && needs.check-release.outputs.is_release != 'true'
    uses: hrzlgnm/actions/.github/workflows/actionlint-reusable.yml@03b79955b43e4b4ae1678541e9d315d4f24c847d # v2.14.8

  aur:
    name: AUR
    needs:
      - changes
      - actionlint
    if: needs.changes.outputs.aur == 'true'
    uses: ./.github/workflows/aur-reusable.yml

  winget:
    name: winget
    needs:
      - changes
      - actionlint
    if: needs.changes.outputs.winget == 'true'
    uses: ./.github/workflows/winget-reusable.yml
    secrets: inherit

  lint:
    needs:
      - changes
      - actionlint
    if: needs.changes.outputs.tauri == 'true' || needs.changes.outputs.lint == 'true'
    uses: ./.github/workflows/lint-reusable.yml

  tests:
    permissions:
      checks: write # required for action-junit-report annotation
    needs:
      - changes
      - actionlint
    if: needs.changes.outputs.tauri == 'true' || needs.changes.outputs.tests == 'true'
    uses: ./.github/workflows/test-reusable.yml

  android:
    name: "📱"
    needs:
      - changes
      - actionlint
    if: needs.changes.outputs.tauri == 'true' || needs.changes.outputs.android == 'true'
    permissions:
      contents: write # needed to upload build artifacts
    uses: ./.github/workflows/android-reusable.yml
    secrets: inherit
    with:
      branch: ${{ needs.changes.outputs.branch }}

  desktop:
    name: "🖥️"
    needs:
      - changes
      - actionlint
    if: needs.changes.outputs.tauri == 'true' || needs.changes.outputs.desktop == 'true'
    permissions:
      contents: write # needed to upload build artifacts
    uses: ./.github/workflows/desktop-reusable.yml
    secrets: inherit
    with:
      branch: ${{ needs.changes.outputs.branch }}

  cache-tools:
    needs:
      - android
      - desktop
      - lint
      - tests
      - check-release
    name: "📦 Cache tools"
    if: always() && needs.check-release.outputs.is_release != 'true' && ( github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' )
    uses: ./.github/workflows/cache-tools-reusable.yml

  docker:
    name: "🐳"
    needs:
      - changes
      - actionlint
    if: needs.changes.outputs.docker == 'true'
    permissions:
      contents: read # needed to checkout code for docker build
      packages: write # needed to push to GHCR

    uses: hrzlgnm/actions/.github/workflows/docker-reusable.yml@03b79955b43e4b4ae1678541e9d315d4f24c847d # v2.14.8
    with:
      branch: ${{ needs.changes.outputs.branch }}

  all-required-green: # This job does nothing and is only used for the branch protection
    name: CI Status
    runs-on: ubuntu-latest
    needs:
      - check-release
      - typos
      - actionlint
      - aur
      - winget
      - lint
      - tests
      - android
      - desktop
      - docker
      - cache-tools
    if: always()
    steps:
      - name: Check whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@a638d6464689bbb24c325bb3fe9404d63a913030
        with:
          allowed-skips: >-
            typos,
            actionlint,
            aur,
            winget,
            lint,
            tests,
            android,
            desktop,
            docker,
            cache-tools
          jobs: ${{ toJSON(needs) }}

name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write # to open Release PRs, tag, and create draft releases
  issues: write # to manage autorelease labels on Release PRs
  pull-requests: write # to open and update Release PRs

jobs:
  release-please:
    name: "🤖 Release Please"
    runs-on: ubuntu-slim
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      prs_created: ${{ steps.release.outputs.prs_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          # GITHUB_TOKEN: pushes come from github-actions[bot] with a
          # verified signature. CI runs on the Release PR are approved
          # by the approve-release-pr job below. Tags are created by
          # release-please (force-tag-creation) alongside the draft.
          token: ${{ secrets.GITHUB_TOKEN }}

  sync-cargo-lock:
    needs: [release-please]
    if: needs.release-please.outputs.prs_created == 'true'
    name: "🔒 Sync Cargo.lock"
    runs-on: ubuntu-slim
    permissions:
      contents: write # update the Release PR branch via the Contents API so the commit carries GitHub's verified signature
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: release-please--branches--main--components--mdns-browser-frontend
          persist-credentials: false

      - name: 🦀🚀
        uses: ./.github/actions/setup-rust-cache

      - name: 🔒 Sync Cargo.lock with the bumped Cargo.toml files
        shell: bash
        run: cargo update --workspace --manifest-path src-tauri/Cargo.toml

      - name: 📤 Commit Cargo.lock if changed
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: release-please--branches--main--components--mdns-browser-frontend
          FILE_PATH: src-tauri/Cargo.lock
        run: |
          if git diff --quiet -- "$FILE_PATH"; then
            echo "Cargo.lock already in sync"
            exit 0
          fi
          # Pushes via `git commit` + `git push` are unsigned and violate
          # the `required_signatures` ruleset on main. Commits created
          # through the Contents API on behalf of github-actions[bot]
          # carry GitHub's verified signature, so use `gh api` instead.
          # The base64 payload (~200 KB) exceeds the 128 KB single-argument
          # limit, so stream the request body from files instead of argv.
          SHA=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${FILE_PATH}?ref=${BRANCH}" --jq .sha)
          base64 -w0 "$FILE_PATH" > /tmp/payload.b64
          jq -n --rawfile content /tmp/payload.b64 --arg sha "$SHA" --arg branch "$BRANCH" \
            '{message: "chore: sync Cargo.lock", content: $content, sha: $sha, branch: $branch}' > /tmp/body.json
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${FILE_PATH}" --input /tmp/body.json

  approve-release-pr:
    needs: [release-please, sync-cargo-lock]
    if: needs.release-please.outputs.prs_created == 'true'
    permissions:
      actions: write # needed to approve workflow runs
      contents: read
      pull-requests: read
    name: "✅ Approve Release PR workflows"
    uses: hrzlgnm/actions/.github/workflows/approve-bot-pr-reusable.yml@0bb9559803ab259be48398d4137dcec658d45bf9 # v2.14.9
    with:
      branch: release-please--branches--main--components--mdns-browser-frontend

  source_checksums:
    needs: [release-please]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write # to upload source checksums to release
      actions: read # to access workflow run information and secrets
    name: 🔢 Generate Source Checksums
    uses: ./.github/workflows/source-checksums-reusable.yml
    secrets: inherit
    with:
      tagName: ${{ needs.release-please.outputs.tag_name }}

  build_android:
    needs: [release-please]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      id-token: write # needed for OIDC token for attestation
      attestations: write # needed to create build attestations
      contents: write # needed to upload build artifacts
    name: 🔨 Build Android
    uses: ./.github/workflows/android-reusable.yml
    secrets: inherit
    with:
      tagName: ${{ needs.release-please.outputs.tag_name }}

  build_desktop:
    needs: [release-please]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      id-token: write # needed for OIDC token for attestation
      attestations: write # needed to create build attestations
      contents: write # needed to upload build artifacts
    name: 🔨 Build Desktop
    uses: ./.github/workflows/desktop-reusable.yml
    secrets: inherit
    with:
      tagName: ${{ needs.release-please.outputs.tag_name }}

  publish:
    # Flips the draft live only when every build job succeeded. A cancelled
    # or failed build skips this job, so a partial release never goes live.
    # This job is the only proper publisher: leave the draft alone. Events
    # fired with GITHUB_TOKEN never create workflow runs, so the downstream
    # packaging workflows are dispatched explicitly below instead of relying
    # on the `release: [released]` trigger.
    needs: [release-please, source_checksums, build_android, build_desktop]
    if: needs.release-please.outputs.release_created == 'true'
    name: "📢 Publish Release"
    runs-on: ubuntu-slim
    permissions:
      contents: write # to publish the draft release
      actions: write # to dispatch the downstream packaging workflows
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 📢 Publish draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: gh release edit "$TAG_NAME" --draft=false --prerelease=false

      - name: 🚀 Dispatch downstream packaging workflows
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          failed=0
          for workflow in winget-reusable.yml homebrew-reusable.yml snap-reusable.yml; do
            if ! gh workflow run "$workflow" --ref "$REF_NAME"; then
              echo "::error::Failed to dispatch $workflow"
              failed=1
            fi
          done
          if ! gh workflow run aur-reusable.yml --ref "$REF_NAME" -f tag_name="$TAG_NAME"; then
            echo "::error::Failed to dispatch aur-reusable.yml"
            failed=1
          fi
          exit "$failed"

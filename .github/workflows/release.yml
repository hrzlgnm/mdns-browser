name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  create_release_draft:
    permissions:
      contents: write # to create and update releases and drafts and upload the versioned-sources artifact
    runs-on: ubuntu-slim
    name: 📝 Draft a new release
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 🛑 Check release preconditions
        uses: hrzlgnm/actions/.github/actions/release-preconditions@03af2e8afc34f86696de4e40b92dda980359c866 # v2.14.0
        with:
          tag-name: ${{ github.ref_name }}

      - name: 🦀 Install Rust toolchain for git-cliff build fallback
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: 🔧 Install git-cliff
        uses: baptiste0928/cargo-install@f204293d9709061b7bc1756fec3ec4e2cd57dec0 # v3
        with:
          crate: git-cliff
          version: 2.14.1
          locked: true

      - name: 📝 Update CHANGELOG.md with the new version
        run: |
          git-cliff --config .github/cliff/cliff.toml --output CHANGELOG.md

      - name: 🎯 Sync version from tag
        uses: ./.github/actions/sync-version
        with:
          tagName: ${{ github.ref_name }}

      - name: 📤 Upload versioned sources artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: versioned-sources
          path: |
            CHANGELOG.md
            Cargo.toml
            Cargo.lock
            src-tauri/Cargo.toml
            src-tauri/tauri.conf.json
            crates/models/Cargo.toml
            crates/shared_constants/Cargo.toml

      - name: 🗒️ Generate release notes with git-cliff
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git-cliff --offline --config .github/cliff/cliff-release.toml --current --output release-body.md

      - name: 🚀 Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${TAG_NAME#v}"
          gh release create "$TAG_NAME" \
            --title "mDNS-Browser v${VERSION}" \
            --notes-file release-body.md \
            --draft \
            --latest=false

  source_checksums:
    needs: [create_release_draft]
    permissions:
      contents: write # to upload source checksums to release
      actions: read # to access workflow run information and secrets
    name: 🔢 Generate Source Checksums
    uses: ./.github/workflows/source-checksums-reusable.yml
    secrets: inherit
    with:
      tagName: ${{ github.ref_name }}

  build_android:
    needs: [create_release_draft]
    permissions:
      id-token: write # needed for OIDC token for attestation
      attestations: write # needed to create build attestations
      contents: write # needed to upload build artifacts
      actions: read # needed to download workflow artifacts
    name: 🔨 Build Android
    uses: ./.github/workflows/android-reusable.yml
    secrets: inherit
    with:
      tagName: ${{ github.ref_name }}

  build_desktop:
    needs: [create_release_draft]
    permissions:
      id-token: write # needed for OIDC token for attestation
      attestations: write # needed to create build attestations
      contents: write # needed to upload build artifacts
      actions: read # needed to download workflow artifacts
    name: 🔨 Build Desktop
    uses: ./.github/workflows/desktop-reusable.yml
    secrets: inherit
    with:
      tagName: ${{ github.ref_name }}



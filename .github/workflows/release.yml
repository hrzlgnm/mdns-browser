name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write # to open Release PRs, tag, and create draft releases
  issues: write # to manage autorelease labels on Release PRs
  pull-requests: write # to open and update Release PRs

jobs:
  release-please:
    name: "🤖 Release Please"
    runs-on: ubuntu-slim
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  prepare:
    needs: [release-please]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read # checkout only; version sync is applied to the working tree, not committed
    runs-on: ubuntu-slim
    name: 📦 Prepare versioned sources
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false

      - name: 🦀 Install Rust toolchain for cargo-edit
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: 🎯 Sync version from release-please tag
        uses: ./.github/actions/sync-version
        with:
          tagName: ${{ needs.release-please.outputs.tag_name }}

      - name: 📤 Upload versioned sources artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: versioned-sources
          path: |
            CHANGELOG.md
            Cargo.toml
            Cargo.lock
            src-tauri/Cargo.toml
            src-tauri/tauri.conf.json
            crates/models/Cargo.toml
            crates/shared_constants/Cargo.toml

  source_checksums:
    needs: [release-please, prepare]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write # to upload source checksums to release
      actions: read # to access workflow run information and secrets
    name: 🔢 Generate Source Checksums
    uses: ./.github/workflows/source-checksums-reusable.yml
    secrets: inherit
    with:
      tagName: ${{ needs.release-please.outputs.tag_name }}

  build_android:
    needs: [release-please, prepare]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      id-token: write # needed for OIDC token for attestation
      attestations: write # needed to create build attestations
      contents: write # needed to upload build artifacts
      actions: read # needed to download workflow artifacts
    name: 🔨 Build Android
    uses: ./.github/workflows/android-reusable.yml
    secrets: inherit
    with:
      tagName: ${{ needs.release-please.outputs.tag_name }}

  build_desktop:
    needs: [release-please, prepare]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      id-token: write # needed for OIDC token for attestation
      attestations: write # needed to create build attestations
      contents: write # needed to upload build artifacts
      actions: read # needed to download workflow artifacts
    name: 🔨 Build Desktop
    uses: ./.github/workflows/desktop-reusable.yml
    secrets: inherit
    with:
      tagName: ${{ needs.release-please.outputs.tag_name }}

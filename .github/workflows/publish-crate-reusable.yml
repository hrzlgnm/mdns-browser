name: Publish Crate (reusable)

# Versions, tags, changelogs and GitHub releases are owned by
# release-please. This workflow only publishes an already-tagged
# release to crates.io (and npm for plugins with JS bindings).

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to publish, e.g. webkit2gtk-nvidia-quirk-v2.2.0
        required: true
        type: string
      dry_run:
        description: Dry run (verify versions without publishing)
        required: false
        type: boolean
        default: false
      publish:
        description: Publish to crates.io after verification
        required: false
        type: boolean
        default: true
      crate_name:
        description: Cargo package name to publish
        required: true
        type: string
      npm_package_dir:
        description: Repo-relative dir of the companion npm package to version and publish (empty skips npm)
        required: false
        type: string
        default: ''
    secrets:
      CARGO_REGISTRY_TOKEN:
        required: true

jobs:
  publish_crate:
    if: inputs.publish || inputs.dry_run
    permissions:
      contents: read
    runs-on: ubuntu-latest
    container: ghcr.io/hrzlgnm/mdns-browser-ubuntu-builder:v1@sha256:919e8043c798855b86062209377324bd08851c26c3d076684873a486c395c6eb
    name: 📦 Publish to crates.io
    steps:
      - name: 🔄 Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.tag }}

      - name: 🦀🚀
        uses: ./.github/actions/setup-rust-cache

      - name: 🔍 Verify tag matches crate version
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          CRATE_NAME: ${{ inputs.crate_name }}
        run: |
          set -euo pipefail
          EXPECTED_VERSION="${TAG##*-v}"
          ACTUAL_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r --arg name "$CRATE_NAME" '.packages[] | select(.name == $name) | .version')
          if [ "$ACTUAL_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "Error: crate version ($ACTUAL_VERSION) does not match tag $TAG (expected $EXPECTED_VERSION)."
            exit 1
          fi
          echo "Version: $ACTUAL_VERSION"

      - name: 📦 Publish to crates.io
        if: inputs.publish && !inputs.dry_run
        shell: bash
        env:
          CRATE_NAME: ${{ inputs.crate_name }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          cargo publish --package "$CRATE_NAME"

      - name: 📦 Dry-run publish to crates.io
        if: inputs.dry_run
        shell: bash
        env:
          CRATE_NAME: ${{ inputs.crate_name }}
        run: |
          set -euo pipefail
          cargo publish --dry-run --package "$CRATE_NAME"

  publish_npm:
    if: (inputs.publish || inputs.dry_run) && inputs.npm_package_dir != ''
    permissions:
      contents: read
      id-token: write # required for npm trusted publishing (OIDC)
    runs-on: ubuntu-latest
    name: 📦 Publish to npm
    steps:
      - name: 🔄 Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.tag }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: 🔍 Verify lockstep versions
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          NPM_PACKAGE_DIR: ${{ inputs.npm_package_dir }}
        run: |
          set -euo pipefail
          EXPECTED_VERSION="${TAG##*-v}"
          NPM_VERSION=$(npm pkg get version --prefix "$NPM_PACKAGE_DIR" | tr -d '"')
          if [ "$NPM_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "Error: npm package version ($NPM_VERSION) does not match tag $TAG (expected $EXPECTED_VERSION)."
            exit 1
          fi
          echo "Version: $NPM_VERSION"

      - name: 📦 Stage publish to npm
        if: inputs.publish && !inputs.dry_run
        shell: bash
        env:
          NPM_PACKAGE_DIR: ${{ inputs.npm_package_dir }}
        run: |
          set -euo pipefail
          # npm publish ignores --prefix when locating package.json, so run
          # from the package directory instead. Staged (not direct)
          # publishing: a maintainer approves each staged version before it
          # goes live.
          cd "$NPM_PACKAGE_DIR"
          npm ci
          npm stage publish

      - name: 📦 Dry-run publish to npm
        if: inputs.dry_run
        shell: bash
        env:
          NPM_PACKAGE_DIR: ${{ inputs.npm_package_dir }}
        run: |
          set -euo pipefail
          cd "$NPM_PACKAGE_DIR"
          npm ci
          npm publish --dry-run

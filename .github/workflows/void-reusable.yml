name: Void Linux XBPS Package

on:
  workflow_call:
    inputs:
      tagName:
        description: "The tag name of the release to publish to"
        required: false
        type: string
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  XBPS_ALLOW_RESTRICTED: yes
  XBPS_CHROOT_CMD: ethereal
  XBPS_ALLOW_CHROOT_BREAKOUT: yes

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/hrzlgnm/mdns-browser-void-package-builder:v1@sha256:fd9d9fe063a4c9420de83afd578a39779e8ac03ff59c2b8360ab9bd4e6f78d75
    steps:
      - name: 🔧 Configure Git safe directory
        run: |
          git config --global --add safe.directory /__w/mdns-browser/mdns-browser

      - name: 🔄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tagName || github.ref }}
          fetch-depth: ${{ inputs.tagName && '0' || '1' }}

      - name: 🔄 Clone Void Packages and binary bootstrap
        shell: bash
        run: |
          git clone --depth=1 https://github.com/void-linux/void-packages.git ~/void-packages
          cd ~/void-packages
          ln -s / masterdir
          mkdir -p hostdir
          ./xbps-src binary-bootstrap
          mv /root/.cargo hostdir/
          mv /root/.rustup hostdir/

      - name: 📥 Download versioned changelog
        if: inputs.tagName
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: changelog
          path: changelog-artifact

      - name: 📝 Copy versioned changelog into hostdir
        if: inputs.tagName
        shell: bash
        run: |
          cp changelog-artifact/CHANGELOG.md ~/void-packages/hostdir/CHANGELOG.md

      - name: 📝 Extract version from latest release
        if: (!inputs.tagName)
        id: get-version-release
        uses: ./.github/actions/latest-release-info

      - name: 📝 Extract version from tag
        if: inputs.tagName
        id: get-version-tag
        shell: bash
        env:
          TAG_NAME: ${{ inputs.tagName }}
        run: |
          VERSION="${TAG_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 📝 Normalize version output
        id: get-version
        run: |
          VERSION="${{ steps.get-version-tag.outputs.version || steps.get-version-release.outputs.version }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=${{ inputs.tagName || steps.get-version-release.outputs.tagName }}" >> "$GITHUB_OUTPUT"

      - name: 🔢 Get Source Tarball Checksum
        id: get-checksum
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.get-version.outputs.tag }}"
          FILENAME="${TAG}.tar.gz.sha256"
          SHA256SUM=$(gh release download "$TAG" -p "$FILENAME" -O - | cut -d ' ' -f1)
          echo "checksum=$SHA256SUM" >> "$GITHUB_OUTPUT"

      - name: 🌀  Generate template
        run: |
          mkdir -p ~/void-packages/srcpkgs/mdns-browser
          packaging/void/generate-template.sh \
            "${{ steps.get-version.outputs.version }}" \
            "${{ steps.get-checksum.outputs.checksum }}" \
            "${{ steps.get-version.outputs.tag }}" \
            > ~/void-packages/srcpkgs/mdns-browser/template

      - name: 📐 Lint generated template
        run: |
          cd ~/void-packages
          xlint srcpkgs/mdns-browser/template
          ./xbps-src -I fetch mdns-browser

      - name: ➕ Add Custom build-style to void packages
        if: inputs.tagName
        run: |
          cp "$GITHUB_WORKSPACE/packaging/void/tauri.sh" ~/void-packages/common/build-style/

      - name: 🔨 Build Package
        if: inputs.tagName
        run: |
          cd ~/void-packages
          ./xbps-src pkg mdns-browser

      - name: 🔑 Sign repository and package
        if: inputs.tagName
        env:
          XBPS_REPOSITORY_SIGNING_KEY: ${{ secrets.XBPS_REPOSITORY_SIGNING_KEY }}
        run: |
          cd ~/void-packages
          echo "$XBPS_REPOSITORY_SIGNING_KEY" > private.pem
          xbps-rindex --privkey private.pem --sign --signedby "hrzlgnm@users.noreply.github.com" hostdir/binpkgs
          xbps-rindex --privkey private.pem --sign-pkg hostdir/binpkgs/*.xbps

      - name: 🛡️ Attest build provenance (publish release only)
        if: inputs.tagName
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            ~/void-packages/hostdir/binpkgs/*

      - name: 🚀 Publish
        if: inputs.tagName
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tagName }}
          VERSION: ${{ steps.get-version.outputs.version }}
        run: |
          ASSETS=()
          for file in \
            "/github/home/void-packages/hostdir/binpkgs/mdns-browser-${VERSION}_1.x86_64.xbps" \
            "/github/home/void-packages/hostdir/binpkgs/mdns-browser-${VERSION}_1.x86_64.xbps.sig2" \
            "/github/home/void-packages/hostdir/binpkgs/x86_64-repodata"; do
            if [ -n "$file" ] && [ -f "$file" ]; then
              ASSETS+=("$file")
            fi
          done
          if [ "${#ASSETS[@]}" -eq 0 ]; then
            echo "No release assets to upload for this platform"
            exit 1
          fi
          gh release upload "$TAG_NAME" "${ASSETS[@]}" --clobber

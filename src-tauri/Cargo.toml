[package]
name = "mdns-browser"
version = "2.5.6"
description = "mDNS browser"
authors = ["hrzlgnm"]
edition = "2021"

[workspace]
members = [
    ".",
]
resolver = "2"

[workspace.dependencies]
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tokio = { version = "1.45", features = ["time"] }
tauri = { version = "2.0", features = ["devtools"] }
tauri-plugin = "2"
tauri-plugin-android-update = "0.3"
tauri-plugin-clipboard-manager = "2.2"
tauri-plugin-log = { version = "2.4", features = ["colored"] }
tauri-plugin-mdns = "0.2"
tauri-plugin-opener = "2.2"
tauri-plugin-process = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2.0"
clap = { version = "4.5", features = ["derive"] }

[build-dependencies]
tauri-build = { version = "2.2", features = [] }

[target.'cfg(not(any(target_os="android",target_os="ios")))'.dependencies]
clap = { workspace = true }
tauri-plugin-process = { workspace = true }
tauri-plugin-updater = { workspace = true }
chrono = { workspace = true }

[target.'cfg(any(target_os="android",target_os="ios"))'.dependencies]
tauri-plugin-android-update = { workspace = true }

[dependencies]
# crates
log = { workspace = true }
serde = { workspace = true }
# required by the tauri::generate_context! macro, no direct use in code
serde_json = { workspace = true }
tauri = { workspace = true }
tauri-plugin-clipboard-manager = { workspace = true }
tauri-plugin-log = { workspace = true }
tauri-plugin-mdns = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-plugin-store = { workspace = true }
tokio = { workspace = true }

# local
webkit2gtk-nvidia-quirk = "2"

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]
devtools = ["tauri/devtools"]

[lib]
name = "mdns_browser_lib"
crate-type = ["staticlib", "cdylib", "lib"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
debug = true
split-debuginfo = "packed"
strip = true

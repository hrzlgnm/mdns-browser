[package]
name = "mdns-browser"
version = "2.9.1"
description = "mDNS browser"
authors = ["hrzlgnm"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.2", features = [] }

[target.'cfg(not(any(target_os="android",target_os="ios")))'.dependencies]
clap = { version = "4.5", features = ["derive"] }
tauri-plugin-process = "2"
tauri-plugin-updater = "2.0"
chrono = "0.4"

[target.'cfg(any(target_os="android",target_os="ios"))'.dependencies]
tauri-plugin-android-update = "0.3"

[dependencies]
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
# required by the tauri::generate_context! macro, no direct use in code
serde_json = "1.0"
tauri = { version = "2.0", features = ["devtools"] }
tauri-plugin-clipboard-manager = "2.2"
tauri-plugin-log = { version = "2.4", features = ["colored"] }
tauri-plugin-mdns = "0.4"
tauri-plugin-opener = "2.2"
tauri-plugin-store = "2"
tokio = { version = "1.45", features = ["time"] }
webkit2gtk-nvidia-quirk = "2"

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]
devtools = ["tauri/devtools"]

[lib]
name = "mdns_browser_lib"
crate-type = ["staticlib", "cdylib", "lib"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
debug = true
split-debuginfo = "packed"
strip = true
